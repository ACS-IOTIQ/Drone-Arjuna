name: DroneArjuna CI

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:

  # ── Backend: lint + tests ────────────────────────────────────────
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        env:
          # Tests use SQLite in-memory (conftest.py) — no real services needed
          DATABASE_URL: "postgresql+asyncpg://da:da@localhost/da_test"
          TIMESCALE_URL: "postgresql+asyncpg://da:da@localhost/da_ts_test"
          SECRET_KEY: "ci_test_secret_key_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          MINIO_USER: "ci_minio_user"
          MINIO_PASSWORD: "ci_minio_password_x9"
          REDIS_URL: "redis://localhost:6379"
          RABBITMQ_URL: "amqp://guest:guest@localhost:5672/"
        run: |
          pytest app/tests/ -v --tb=short

  # ── Frontend: type-check + build ─────────────────────────────────
  frontend:
    name: Frontend (tsc + vite build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Vite production build
        run: npm run build

  # ── Docker: build images (no push) ───────────────────────────────
  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: dronearjuna/backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: dronearjuna/frontend:ci

  # -- Security scanning ---------------------------------------------
  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit
        run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - name: npm audit (production dependencies)
        # Dev-only tooling (vite dev server, tailwind watchers) never ships in the
        # nginx image, so the gate covers what is actually deployed.
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: "1"
