[pytest]
asyncio_mode = auto
testpaths = app/tests
# Registered here (rather than via `pytest_plugins` in app/tests/conftest.py)
# because pytest no longer allows `pytest_plugins` in a non-top-level
# conftest, and "top-level" shifts with whatever directory pytest is
# invoked from — this -p flag works regardless of invocation directory.
addopts = -p app.tests.testcase_word_report
log_cli = true
log_cli_level = WARNING
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::pytest.PytestUnraisableExceptionWarning
