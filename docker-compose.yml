services:

  # ── PostgreSQL + PostGIS ──────────────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.3
    container_name: da_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dronearjuna}
      POSTGRES_USER: ${POSTGRES_USER:-da_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    networks:
      - da_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-da_admin} -d ${POSTGRES_DB:-dronearjuna}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── TimescaleDB (telemetry time-series) ──────────────────────────
  timescale:
    # The HA image ships a ~1 GB base layer and was repeatedly failing with
    # unexpected EOF during pulls on slower/flaky Docker Hub connections.
    # We only need core TimescaleDB features here, so prefer the smaller
    # single-node image for much more reliable local startup.
    image: timescale/timescaledb:latest-pg15
    container_name: da_timescale
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TIMESCALE_DB:-da_telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-da_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - timescale_data:/home/postgres/pgdata/data
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - da_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-da_admin} -d ${TIMESCALE_DB:-da_telemetry}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PG Admin (Web UI For DB) ───────────────────────────────────────
  pgadmin:
    # Pinned (not :latest) — a "latest" pull picked up a build shipping
    # Python 3.14 whose first-run setup (password hashing / DB migration)
    # spins forever instead of completing. 8.14 runs a stable Python 3.12.
    image: dpage/pgadmin4:8.14
    container_name: da_pgadmin
    profiles: ["dev"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@dronearjuna.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?set PGADMIN_DEFAULT_PASSWORD in .env}
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docs/pgadmin-servers.json:/pgadmin4/servers.json:ro
    ports:
      - "127.0.0.1:5050:80"
    networks:
      - da_network
    depends_on:
      postgres:
        condition: service_healthy
      timescale:
        condition: service_healthy

  # ── Redis (cache + session) ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: da_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}   # read by the healthcheck below (the command line alone is not enough)
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - da_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── RabbitMQ (event bus) ──────────────────────────────────────────
  rabbitmq:
    # Pin to a current official tag to avoid stale/corrupted image metadata on Docker Desktop.
    image: rabbitmq:4.3.3-management-alpine
    container_name: da_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-da_mq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"   # Management UI
    networks:
      - da_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── MinIO (object storage: video, imagery) ────────────────────────
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: da_minio
    restart: unless-stopped
    user: root
    command: minio server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-da_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?set MINIO_PASSWORD in .env}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9002:9000"   # host 9000 is taken by guardian-vault-minio
      - "127.0.0.1:9003:9001"   # Console UI
    networks:
      - da_network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ── Elasticsearch (full-text search — P4-06) ─────────────────────
  elasticsearch:
    # Use Elastic's official registry directly; Docker Hub pulls were intermittently
    # failing with EOF through Docker Desktop's proxy on this machine.
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: da_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in .env}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    networks:
      - da_network
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 20s
      timeout: 10s
      retries: 10

  # ── Mailhog (dev email inbox) ─────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: da_mailhog
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"   # SMTP — backend sends here
      - "127.0.0.1:8025:8025"   # Web UI — open http://localhost:8025 to read emails
    networks:
      - da_network

  # ── FastAPI Backend ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: da_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-da_admin}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-dronearjuna}
      TIMESCALE_URL: postgresql+asyncpg://${POSTGRES_USER:-da_admin}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@timescale:5432/${TIMESCALE_DB:-da_telemetry}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-da_mq}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ELASTICSEARCH_URL: http://elastic:${ELASTIC_PASSWORD}@elasticsearch:9200
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9002}
      MINIO_USER: ${MINIO_USER:-da_minio}
      MINIO_PASSWORD: ${MINIO_PASSWORD:?set MINIO_PASSWORD in .env}
      HF_FEED_HOST: 0.0.0.0     # inside the container; the host side is limited by RADIO_BIND_ADDR
    ports:
      - "127.0.0.1:8000:8000"
      - "${RADIO_BIND_ADDR:-127.0.0.1}:14550:14550/udp"   # ArduPilot SITL / MAVLink UDP inbound
      - "${RADIO_BIND_ADDR:-127.0.0.1}:10110:10110/udp"   # Vessel NMEA GGA feed
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach Windows host from container (SITL TCP)
    depends_on:
      postgres:
        condition: service_healthy
      timescale:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app   # Hot reload in dev
      - .:/project:ro    # project root (read-only) for infra tests
      # DB dumps live on the HOST (./backend/backups), not in a named volume, so they
      # survive `docker compose down -v` and Docker Desktop resets — the wiped DB is
      # then reloaded from them automatically at the next startup (core/backup.py).
      - ./backend/backups:/app/backups
    # No privileged mode: grant only serial device cgroup access (ttyUSB/ttyACM).
    device_cgroup_rules:
      - "c 188:* rmw"
      - "c 166:* rmw"
    networks:
      - da_network
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # ── React Frontend ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: da_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - da_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
      VITE_API_PROXY_TARGET: http://backend:8000

volumes:
  postgres_data:
  timescale_data:
  pgadmin_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  es_data:

networks:
  da_network:
    driver: bridge
