services:

  # ── PostgreSQL + PostGIS ──────────────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.3
    container_name: da_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dronearjuna}
      POSTGRES_USER: ${POSTGRES_USER:-da_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - da_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-da_admin} -d ${POSTGRES_DB:-dronearjuna}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── TimescaleDB (telemetry time-series) ──────────────────────────
  timescale:
    image: timescale/timescaledb-ha:pg15-latest
    container_name: da_timescale
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TIMESCALE_DB:-da_telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-da_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - timescale_data:/home/postgres/pgdata/data
    ports:
      - "5433:5432"
    networks:
      - da_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-da_admin} -d ${TIMESCALE_DB:-da_telemetry}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PG Admin (Web UI For DB) ───────────────────────────────────────
  pgadmin:
    # Pinned (not :latest) — a "latest" pull picked up a build shipping
    # Python 3.14 whose first-run setup (password hashing / DB migration)
    # spins forever instead of completing. 8.14 runs a stable Python 3.12.
    image: dpage/pgadmin4:8.14
    container_name: da_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@dronearjuna.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-changeme}
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docs/pgadmin-servers.json:/pgadmin4/servers.json:ro
    ports:
      - "5050:80"
    networks:
      - da_network
    depends_on:
      postgres:
        condition: service_healthy
      timescale:
        condition: service_healthy

  # ── Redis (cache + session) ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: da_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - da_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── RabbitMQ (event bus) ──────────────────────────────────────────
  rabbitmq:
    # Pin to a current official tag to avoid stale/corrupted image metadata on Docker Desktop.
    image: rabbitmq:4.3.3-management-alpine
    container_name: da_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-da_mq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-changeme}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI
    networks:
      - da_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── MinIO (object storage: video, imagery) ────────────────────────
  minio:
    image: minio/minio:latest
    container_name: da_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-da_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-changeme123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"   # Console UI
    networks:
      - da_network


  # ── Elasticsearch (full-text search — P4-06) ─────────────────────
  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: da_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - da_network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 20s
      timeout: 10s
      retries: 10

  # ── Mailhog (dev email inbox) ─────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: da_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP — backend sends here
      - "8025:8025"   # Web UI — open http://localhost:8025 to read emails
    networks:
      - da_network

  # ── FastAPI Backend ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: da_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-da_admin}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-dronearjuna}
      TIMESCALE_URL: postgresql+asyncpg://${POSTGRES_USER:-da_admin}:${POSTGRES_PASSWORD:-changeme}@timescale:5432/${TIMESCALE_DB:-da_telemetry}
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-da_mq}:${RABBITMQ_PASSWORD:-changeme}@rabbitmq:5672/
      SECRET_KEY: ${SECRET_KEY:-please-change-this-secret-key-in-production}
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - "8000:8000"
      - "14550:14550/udp"   # ArduPilot SITL / MAVLink UDP inbound
      - "14560:14560/udp"   # Simulated-drone MAVLink broadcast outbound to external GCS
      - "10110:10110/udp"   # Vessel NMEA GGA feed
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach Windows host from container (SITL TCP)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./backend:/app   # Hot reload in dev
      - .:/project:ro    # project root (read-only) for infra tests
    privileged: true   # allows access to USB serial devices passed in via usbipd-win
    networks:
      - da_network
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # ── React Frontend ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: da_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - da_network
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
      VITE_API_PROXY_TARGET: http://backend:8000

volumes:
  postgres_data:
  timescale_data:
  pgadmin_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  es_data:

networks:
  da_network:
    driver: bridge
