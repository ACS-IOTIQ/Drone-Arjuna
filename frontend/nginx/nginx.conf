# TLS-terminating reverse proxy + static SPA host.
# Certificates are mounted at /etc/nginx/certs/{tls.crt,tls.key} (see docker-compose.prod.yml).
# NOTE: add_header directives are not inherited into a location that defines its own,
# so shared security headers live in /etc/nginx/conf.d snippets via `include` below.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server_tokens off;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # Matches the backend's 100 MB analyst-upload cap.
    client_max_body_size 100m;

    root /usr/share/nginx/html;
    index index.html;

    # API + WebSockets -> backend (port 8000 is not published to the host).
    # The backend adds its own security headers; HSTS is added here.
    location /api/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append client-supplied values
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;                         # long-lived telemetry sockets
    }

    # Native camera backend (webcam capture) - see backend/run_native.ps1
    location /camera-api/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        rewrite ^/camera-api/(.*)$ /api/$1 break;
        proxy_pass http://host.docker.internal:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA shell: always revalidate so a new deploy is picked up.
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
